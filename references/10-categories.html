<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourKokan — Categories</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{--ocean-deep:#0D3D4A;--ocean-mid:#1B6B7B;--ocean-foam:#B8E4EA;--sand-mid:#C4972A;--forest-deep:#1A3320;--forest-mid:#2E5C3A;--forest-pale:#D4EDD9;--cream:#FAF7F0;--text-dark:#1C1917;--text-mid:#44403C;--text-light:#78716C;--white:#FFF;--radius-md:18px}
*{margin:0;padding:0;box-sizing:border-box}
html{font-family:'DM Sans',sans-serif;background:#0D1F26}
body{background:radial-gradient(ellipse at 20% 20%,#0D3D4A88 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,#1A332044 0%,transparent 60%),#0C1A1F;min-height:100vh;padding:40px 20px;display:flex;justify-content:center}
.screen-wrapper{display:flex;flex-direction:column;align-items:center;gap:16px}
.screen-label{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#B8E4EA;opacity:.7}
.phone{width:375px;min-height:812px;background:var(--cream);border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #ffffff18,0 40px 80px #00000088;position:relative}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#0D1F26;border-radius:0 0 20px 20px;z-index:100}
.cat-screen{background:var(--cream);min-height:812px;overflow-y:auto;padding-bottom:80px}
.header{background:linear-gradient(135deg,var(--ocean-deep),var(--forest-deep));padding:50px 20px 32px;position:relative}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:28px;background:var(--cream);clip-path:ellipse(60% 100% at 50% 100%)}
.header-back{width:36px;height:36px;border-radius:50%;background:#ffffff18;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--white);margin-bottom:16px;cursor:pointer}
.header-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--white)}
.categories-list{padding:20px;display:flex;flex-direction:column;gap:8px}
.category-item{background:var(--white);border-radius:var(--radius-md);padding:18px;cursor:pointer;box-shadow:0 2px 8px #0000000a;transition:all .3s}
.category-item:hover{box-shadow:0 6px 16px #00000014;transform:translateX(4px)}
.category-header{display:flex;align-items:center;gap:14px}
.category-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--ocean-foam),var(--forest-pale));display:flex;align-items:center;justify-content:center;font-size:26px}
.category-content{flex:1}
.category-name{font-size:16px;font-weight:600;color:var(--text-dark);margin-bottom:4px}
.category-count{font-size:12px;color:var(--text-light)}
.category-arrow{font-size:20px;color:var(--text-light)}
.subcategories{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #00000008;gap:8px;flex-wrap:wrap}
.subcategories.show{display:flex}
.subcat-pill{background:var(--forest-pale);color:var(--forest-mid);padding:6px 14px;border-radius:50px;font-size:12px;font-weight:500}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:var(--white);display:flex;justify-content:space-around;padding:12px 0;box-shadow:0 -4px 24px #0000001a;border-radius:44px 44px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;border-radius:10px;text-decoration:none;color:var(--text-light);font-size:11px;font-weight:500}
.nav-item.active{background:linear-gradient(135deg,var(--ocean-foam),var(--forest-pale));color:var(--ocean-deep)}
</style>
</head>
<body>
<div class="screen-wrapper">
<div class="screen-label">SCREEN 10 — CATEGORIES</div>
<div class="phone">
<div class="phone-notch"></div>
<div class="cat-screen">
<div class="header">
<div class="header-back">←</div>
<h1 class="header-title">Categories</h1>
</div>
<div class="categories-list">
<div class="category-item">
<div class="category-header">
<div class="category-icon">🏝</div>
<div class="category-content">
<div class="category-name">Kokan View</div>
<div class="category-count">45 places</div>
</div>
<div class="category-arrow">∨</div>
</div>
<div class="subcategories show">
<span class="subcat-pill">🏖 Beaches (12)</span>
<span class="subcat-pill">🏰 Forts (8)</span>
<span class="subcat-pill">🙏 Temples (15)</span>
<span class="subcat-pill">🏞 Nature (10)</span>
</div>
</div>
<div class="category-item">
<div class="category-header">
<div class="category-icon">🏨</div>
<div class="category-content">
<div class="category-name">Accommodation</div>
<div class="category-count">28 places</div>
</div>
<div class="category-arrow">›</div>
</div>
</div>
<div class="category-item">
<div class="category-header">
<div class="category-icon">🍽</div>
<div class="category-content">
<div class="category-name">Food & Dining</div>
<div class="category-count">34 places</div>
</div>
<div class="category-arrow">›</div>
</div>
</div>
<div class="category-item">
<div class="category-header">
<div class="category-icon">🚌</div>
<div class="category-content">
<div class="category-name">Transportation</div>
<div class="category-count">8 stations</div>
</div>
<div class="category-arrow">›</div>
</div>
</div>
<div class="category-item">
<div class="category-header">
<div class="category-icon">🚨</div>
<div class="category-content">
<div class="category-name">Emergency</div>
<div class="category-count">24 contacts</div>
</div>
<div class="category-arrow">›</div>
</div>
</div>
<div class="category-item">
<div class="category-header">
<div class="category-icon">🏛</div>
<div class="category-content">
<div class="category-name">Government</div>
<div class="category-count">15 offices</div>
</div>
<div class="category-arrow">›</div>
</div>
</div>
</div>
<nav class="bottom-nav">
<a href="#" class="nav-item"><span style="font-size:22px">🏠</span><span>Home</span></a>
<a href="#" class="nav-item active"><span style="font-size:22px">🔍</span><span>Discover</span></a>
<a href="#" class="nav-item"><span style="font-size:22px">🚌</span><span>MSRTC</span></a>
<a href="#" class="nav-item"><span style="font-size:22px">❤️</span><span>Saved</span></a>
<a href="#" class="nav-item"><span style="font-size:22px">👤</span><span>Profile</span></a>
</nav>
</div>
</div>
</div>
</body>
</html>
