<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourKokan — MSRTC Search</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{--ocean-deep:#0D3D4A;--ocean-mid:#1B6B7B;--ocean-foam:#B8E4EA;--sand-mid:#C4972A;--earth-mid:#6B4226;--forest-deep:#1A3320;--forest-mid:#2E5C3A;--cream:#FAF7F0;--text-dark:#1C1917;--text-mid:#44403C;--text-light:#78716C;--white:#FFF;--radius-md:18px}
*{margin:0;padding:0;box-sizing:border-box}
html{font-family:'DM Sans',sans-serif;background:#0D1F26}
body{background:radial-gradient(ellipse at 20% 20%,#0D3D4A88 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,#1A332044 0%,transparent 60%),#0C1A1F;min-height:100vh;padding:40px 20px;display:flex;justify-content:center}
.screen-wrapper{display:flex;flex-direction:column;align-items:center;gap:16px}
.screen-label{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#B8E4EA;opacity:.7}
.phone{width:375px;min-height:812px;background:var(--cream);border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #ffffff18,0 40px 80px #00000088;position:relative}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#0D1F26;border-radius:0 0 20px 20px;z-index:100}
.msrtc-screen{background:var(--cream);min-height:812px;overflow-y:auto;padding-bottom:80px}
.header{background:linear-gradient(135deg,var(--ocean-deep),var(--forest-deep));padding:50px 20px 40px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 80% 20%,#ffffff11 0%,transparent 50%),radial-gradient(circle at 20% 80%,#00000022 0%,transparent 50%)}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:28px;background:var(--cream);clip-path:ellipse(60% 100% at 50% 100%)}
.back-btn{width:36px;height:36px;border-radius:50%;background:#ffffff18;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--white);margin-bottom:16px;cursor:pointer;position:relative;z-index:2}
.header-content{position:relative;z-index:2;text-align:center}
.header-icon{font-size:48px;margin-bottom:12px}
.header-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--white);margin-bottom:6px}
.header-subtitle{font-size:13px;color:var(--ocean-foam);opacity:.85}
.search-section{padding:0 20px;margin-top:-24px;position:relative;z-index:10}
.search-card{background:var(--white);border-radius:var(--radius-md);padding:20px;box-shadow:0 8px 24px #00000018}
.input-group{margin-bottom:16px}
.input-label{font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:8px;display:block}
.input-wrapper{position:relative}
.input-field{width:100%;padding:14px 16px;border:1.5px solid #00000012;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;background:var(--white)}
.input-field:focus{outline:none;border-color:var(--ocean-mid);box-shadow:0 0 0 3px #1B6B7B18}
.swap-btn{position:absolute;right:50%;transform:translateX(50%);top:-8px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sand-mid),var(--earth-mid));display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--white);cursor:pointer;box-shadow:0 4px 12px #C4972A44;z-index:10}
.search-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--ocean-mid),var(--forest-mid));color:var(--white);border:none;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px #1B6B7B44;margin-top:8px}
.content{padding:24px 20px}
.section-title{font-size:14px;font-weight:600;color:var(--text-mid);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.recent-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.recent-item{background:var(--white);border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 8px #0000000a;transition:all .3s}
.recent-item:hover{box-shadow:0 4px 16px #00000014;transform:translateX(4px)}
.recent-icon{font-size:24px}
.recent-text{flex:1}
.recent-route{font-size:14px;font-weight:600;color:var(--text-dark);margin-bottom:2px}
.recent-time{font-size:11px;color:var(--text-light)}
.popular-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.popular-card{background:var(--white);border-radius:var(--radius-md);padding:16px;text-align:center;cursor:pointer;box-shadow:0 2px 8px #0000000a;transition:all .3s}
.popular-card:hover{transform:translateY(-4px);box-shadow:0 6px 16px #00000014}
.popular-icon{font-size:32px;margin-bottom:8px}
.popular-text{font-size:13px;font-weight:600;color:var(--text-dark)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:var(--white);display:flex;justify-content:space-around;padding:12px 0;box-shadow:0 -4px 24px #0000001a;border-radius:44px 44px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;border-radius:10px;color:var(--text-light);font-size:11px;font-weight:500;text-decoration:none}
.nav-item.active{background:linear-gradient(135deg,var(--sand-mid),var(--earth-mid));color:var(--white);box-shadow:0 4px 12px #C4972A33}
</style>
</head>
<body>
<div class="screen-wrapper">
<div class="screen-label">SCREEN 13 — MSRTC SEARCH</div>
<div class="phone">
<div class="phone-notch"></div>
<div class="msrtc-screen">
<div class="header">
<div class="back-btn">←</div>
<div class="header-content">
<div class="header-icon">🚌</div>
<h1 class="header-title">MSRTC Bus Routes</h1>
<p class="header-subtitle">Search routes across 8 talukas</p>
</div>
</div>
<div class="search-section">
<div class="search-card">
<div class="input-group">
<label class="input-label">FROM</label>
<input type="text" class="input-field" placeholder="Enter source location" value="Kankavli">
</div>
<div style="position:relative;margin:16px 0">
<div class="swap-btn">⇅</div>
</div>
<div class="input-group">
<label class="input-label">TO</label>
<input type="text" class="input-field" placeholder="Enter destination" value="Mumbai">
</div>
<button class="search-btn">Search Routes 🔍</button>
</div>
</div>
<div class="content">
<h2 class="section-title">Recent Searches</h2>
<div class="recent-list">
<div class="recent-item">
<span class="recent-icon">🕐</span>
<div class="recent-text">
<div class="recent-route">Kankavli → Mumbai</div>
<div class="recent-time">Today, 2:30 PM</div>
</div>
</div>
<div class="recent-item">
<span class="recent-icon">🕐</span>
<div class="recent-text">
<div class="recent-route">Malvan → Pune</div>
<div class="recent-time">Yesterday</div>
</div>
</div>
<div class="recent-item">
<span class="recent-icon">🕐</span>
<div class="recent-text">
<div class="recent-route">Sindhudurg → Kolhapur</div>
<div class="recent-time">2 days ago</div>
</div>
</div>
</div>
<h2 class="section-title">Popular Routes</h2>
<div class="popular-grid">
<div class="popular-card">
<div class="popular-icon">🏙</div>
<div class="popular-text">Mumbai</div>
</div>
<div class="popular-card">
<div class="popular-icon">🏛</div>
<div class="popular-text">Pune</div>
</div>
<div class="popular-card">
<div class="popular-icon">🌾</div>
<div class="popular-text">Kolhapur</div>
</div>
<div class="popular-card">
<div class="popular-icon">⚡</div>
<div class="popular-text">Ratnagiri</div>
</div>
</div>
</div>
<nav class="bottom-nav">
<a href="#" class="nav-item"><span style="font-size:22px">🏠</span><span>Home</span></a>
<a href="#" class="nav-item"><span style="font-size:22px">🔍</span><span>Discover</span></a>
<a href="#" class="nav-item active"><span style="font-size:22px">🚌</span><span>MSRTC</span></a>
<a href="#" class="nav-item"><span style="font-size:22px">❤️</span><span>Saved</span></a>
<a href="#" class="nav-item"><span style="font-size:22px">👤</span><span>Profile</span></a>
</nav>
</div>
</div>
</div>
</body>
</html>
